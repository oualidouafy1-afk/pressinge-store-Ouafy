<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر لوازم مغسلة الملابس - وليد وافي</title>
    <meta name="description" content="مرحبا بجميع الزوار في مشروعي المتواضع لاقتناء الات التصبين او اي استفسار او اخد معلومات لانني اكسب خبرة كافية في مجال الات التصبين من النوع الكبير والصغير">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>🧺 متجر لوازم مغسلة الملابس</h2>
        <p>صاحب المشروع: <strong>وليد وافي</strong></p>
    </header>

    <div class="container">
        <div class="products">
            <div class="card">
                <img src="https://arabic.autowashingmachine.com/photo/ps19576497-large_capacity_70kg_automatic_front_load_washer_industrial_washing_machine.jpg" alt="غسالة صناعية">
                <h3>غسالة صناعية كبيرة</h3>
                <p>السعر: 12000 درهم</p>
                <button onclick="addToCart('غسالة صناعية كبيرة',12000)">إضافة للسلة</button>
            </div>

            <div class="card">
                <img src="ouafy.jpeg" alt="غسالة عادية">
                <h3>غسالة أوتوماتيكية</h3>
                <p>السعر: 4500 درهم</p>
                <button onclick="addToCart('غسالة أوتوماتيكية',4500)">إضافة للسلة</button>
            </div>

            <div class="card">
                <img src="ouialid.png" alt="مسحوق غسيل">
                <h3>مسحوق غسيل احترافي</h3>
                <p>السعر: 300 درهم</p>
                <button onclick="addToCart('مسحوق غسيل احترافي',300)">إضافة للسلة</button>
            </div>
        </div>

        <div class="cart">
            <h3>🛒 سلة المشتريات</h3>
            <ul id="cartList"></ul>
            <p class="total">المجموع: <span id="total">0</span> درهم</p>
            <button onclick="confirmOrder()">تأكيد الطلب</button>
            <button onclick="orderWhatsApp()">طلب عبر واتساب</button>
        </div>
    </div>

    <footer>
        ©️ 2026 جميع الحقوق محفوظة - وليد وافي
    </footer>

    <script src="script.js"></script>
</body>
</html>
